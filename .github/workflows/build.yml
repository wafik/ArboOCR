name: Build & Test
on:
  push:
    branches: [main, master]
    # Docs-only commits can't break the build. No branch protection requires
    # this check today; if that changes, drop paths-ignore from pull_request —
    # a skipped required check blocks the merge instead of passing it.
    paths-ignore: ['docs/**', 'scripts/**', '**/*.md']
  pull_request:
    branches: [main, master]
    paths-ignore: ['docs/**', 'scripts/**', '**/*.md']

# One run per branch/PR. Without this, merging a PR leaves its in-flight run
# racing the push run for main — which is how a 1.5 GB cache restore got
# cancelled mid-extract. Releases are never cancelled; release.yml has no group.
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Restore FIRST so the disk-cleanup step below can be skipped on a hit.
      # split restore/save because save-always is deprecated, and because
      # cancel-in-progress means we want the save to run even when cancelled.
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/build/linux-x64/vcpkg_installed
          key: vcpkg-linux-x64-${{ hashFiles('vcpkg.json') }}-cd61e1e-release-only
          # -release-only suffix: the old keys hold debug+release layouts for
          # the default triplets (see Configure). Restoring one would be a
          # ~800 MB download of bits the release-only triplets below cannot
          # reuse, so restore-keys stay within the new lineage only.
          restore-keys: |
            vcpkg-linux-x64-${{ hashFiles('vcpkg.json') }}-cd61e1e-release-only-

      # 1. Kosongkan disk agar build OpenCV tidak gagal karena storage penuh.
      # Only needed when vcpkg has to build from source. On an exact cache hit
      # nothing is compiled, and this step costs ~2m33s — longer than the whole
      # Windows job. A restore-keys partial hit reports cache-hit=false, so a
      # stale cache still gets the disk space it needs.
      - name: Free Disk Space (Ubuntu)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 2. Toolchain + the autotools vcpkg ports build with. The X11/GL/Wayland
      #    dev packages that used to be here existed only for OpenCV's gtk,
      #    highgui and opengl features; vcpkg.json no longer enables those, so
      #    nothing asks for them.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            gperf \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libtool-bin

      # 3. Setup vcpkg. Its built-in "x-gha" binary caching backend has been
      # removed upstream (silently no-ops every run, confirmed in logs), so
      # vcpkg_installed is cached explicitly above instead — same key scheme as
      # release.yml, so a cache warmed by either workflow benefits the other.
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
          vcpkgJsonGlob: '**/vcpkg.json'

      # Write release-only overlay triplets into RUNNER_TEMP (generated at
      # runtime, so the committed tree stays inside .github/workflows/).
      # VCPKG_BUILD_TYPE is a TRIPLET variable ("You can set this value to
      # `release` to build release-only versions of the ports", MS Learn:
      # vcpkg/users/triplets). The old `-DVCPKG_BUILD_TYPE=release` on the
      # cmake line was a silent no-op — every green log ends Configure with
      # "Manually-specified variables were not used by the project:
      # VCPKG_BUILD_TYPE" — so vcpkg built every port TWICE (~24 debug +
      # ~29 release builds: onnxruntime 38-44 min, protobuf ~11-15 min,
      # opencv4 ~7-10 min per OS). Same-name overlay files shadow the built-in
      # triplets, so install paths (vcpkg_installed/x64-*) and everything
      # downstream are untouched.
      - name: Write release-only vcpkg triplets
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-triplets"
          printf '%s\n' \
            '# Release-only shadow of the pinned built-in x64-linux triplet' \
            '# (vcpkg commit cd61e1e). See the Configure step for why.' \
            'set(VCPKG_TARGET_ARCHITECTURE x64)' \
            'set(VCPKG_CRT_LINKAGE dynamic)' \
            'set(VCPKG_LIBRARY_LINKAGE static)' \
            'set(VCPKG_CMAKE_SYSTEM_NAME Linux)' \
            'set(VCPKG_BUILD_TYPE release)' \
            > "$RUNNER_TEMP/vcpkg-triplets/x64-linux.cmake"
          printf '%s\n' \
            '# Release-only shadow of the pinned built-in x64-windows triplet' \
            '# (vcpkg commit cd61e1e). See the Configure step for why.' \
            'set(VCPKG_TARGET_ARCHITECTURE x64)' \
            'set(VCPKG_CRT_LINKAGE dynamic)' \
            'set(VCPKG_LIBRARY_LINKAGE dynamic)' \
            'set(VCPKG_BUILD_TYPE release)' \
            > "$RUNNER_TEMP/vcpkg-triplets/x64-windows.cmake"

      # 4. Configure & install dependencies via vcpkg. Cold Configure was
      # 66-80 min of full debug+release source builds; release-only roughly
      # halves it, and the 60 min timeout turns any future hang into a loud
      # failure instead of a 6-hour billing surprise.
      - name: Configure
        timeout-minutes: 60
        run: cmake --preset linux-x64 "-DVCPKG_OVERLAY_TRIPLETS=$RUNNER_TEMP/vcpkg-triplets"

      # 5. Hapus sampah kompilasi untuk menghemat space sebelum build utama
      - name: Clean vcpkg buildtrees
        run: rm -rf build/linux-x64/vcpkg_installed/*/buildtrees/* || true

      - name: Build
        run: cmake --build build/linux-x64 --config Release -j$(nproc)

      - name: Test
        run: ctest --test-dir build/linux-x64 -C Release --output-on-failure

      # Verify the install/export actually produces a usable package. Windows
      # covers this locally; Linux is where the vcpkg include paths differ.
      - name: Verify install
        run: |
          cmake --install build/linux-x64 --prefix "$RUNNER_TEMP/arboocr-prefix"
          test -f "$RUNNER_TEMP/arboocr-prefix/lib/cmake/arboOCR/arboOCRConfig.cmake"
          test -f "$RUNNER_TEMP/arboocr-prefix/include/arboOCR/engine.hpp"

      - name: Save vcpkg cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/build/linux-x64/vcpkg_installed
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/build/windows-x64/vcpkg_installed
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json') }}-cd61e1e-release-only
          # See the linux job: old keys hold debug+release layouts the new
          # release-only triplets cannot reuse, so stay in the new lineage.
          restore-keys: |
            vcpkg-windows-x64-${{ hashFiles('vcpkg.json') }}-cd61e1e-release-only-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
          vcpkgJsonGlob: '**/vcpkg.json'

      # Same generated release-only overlay triplets as the linux job (see its
      # comment: the old -DVCPKG_BUILD_TYPE on the cmake line was a silent
      # no-op and doubled the port work). PowerShell heredoc, same content.
      - name: Write release-only vcpkg triplets
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "vcpkg-triplets"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @(
            "# Release-only shadow of the pinned built-in x64-windows triplet",
            "# (vcpkg commit cd61e1e). See the Configure step for why.",
            "set(VCPKG_TARGET_ARCHITECTURE x64)",
            "set(VCPKG_CRT_LINKAGE dynamic)",
            "set(VCPKG_LIBRARY_LINKAGE dynamic)",
            "set(VCPKG_BUILD_TYPE release)"
          ) | Set-Content -Path (Join-Path $dir "x64-windows.cmake") -Encoding ascii
          @(
            "# Release-only shadow of the pinned built-in x64-linux triplet",
            "# (vcpkg commit cd61e1e). See the Configure step for why.",
            "set(VCPKG_TARGET_ARCHITECTURE x64)",
            "set(VCPKG_CRT_LINKAGE dynamic)",
            "set(VCPKG_LIBRARY_LINKAGE static)",
            "set(VCPKG_CMAKE_SYSTEM_NAME Linux)",
            "set(VCPKG_BUILD_TYPE release)"
          ) | Set-Content -Path (Join-Path $dir "x64-linux.cmake") -Encoding ascii
        shell: pwsh

      - name: Configure
        timeout-minutes: 60
        run: cmake --preset windows-x64 "-DVCPKG_OVERLAY_TRIPLETS=$env:RUNNER_TEMP/vcpkg-triplets"

      - name: Clean vcpkg buildtrees (Windows)
        run: Remove-Item -Recurse -Force build\windows-x64\vcpkg_installed\*\buildtrees\* -ErrorAction SilentlyContinue

      - name: Build
        run: cmake --build build/windows-x64 --config Release

      - name: Test
        run: ctest --test-dir build/windows-x64 -C Release --output-on-failure

      - name: Save vcpkg cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/build/windows-x64/vcpkg_installed
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
