name: Build & Test
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. WAJIB: Kosongkan disk (agar build OpenCV tidak gagal karena storage Ubuntu penuh)
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 2. Toolchain + the autotools vcpkg ports build with. The X11/GL/Wayland
      #    dev packages that used to be here existed only for OpenCV's gtk,
      #    highgui and opengl features; vcpkg.json no longer enables those, so
      #    nothing asks for them.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            gperf \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libtool-bin

      # 3. Setup vcpkg. Its built-in "x-gha" binary caching backend has been
      # removed upstream (silently no-ops every run, confirmed in logs), so
      # cache vcpkg_installed explicitly below instead — same key scheme as
      # release.yml, so a cache warmed by either workflow benefits the other.
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/linux-x64/vcpkg_installed
          key: vcpkg-linux-x64-${{ hashFiles('vcpkg.json') }}-cd61e1e
          restore-keys: |
            vcpkg-linux-x64-${{ hashFiles('vcpkg.json') }}-
            vcpkg-linux-x64-
          save-always: true

      # 4. Configure & Install Dependencies via vcpkg
      - name: Configure
        run: cmake --preset linux-x64 -DVCPKG_BUILD_TYPE=release
        
      # 5. OPTIMASI: Hapus sampah kompilasi untuk menghemat space sebelum build aplikasi utama Anda
      - name: Clean vcpkg buildtrees
        run: rm -rf build/linux-x64/vcpkg_installed/*/buildtrees/* || true

      - name: Build
        run: cmake --build build/linux-x64 --config Release -j$(nproc)
        
      - name: Test
        run: ctest --test-dir build/linux-x64 -C Release --output-on-failure


  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/windows-x64/vcpkg_installed
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json') }}-cd61e1e
          restore-keys: |
            vcpkg-windows-x64-${{ hashFiles('vcpkg.json') }}-
            vcpkg-windows-x64-
          save-always: true

      - name: Configure
        run: cmake --preset windows-x64 -DVCPKG_BUILD_TYPE=release
        
      - name: Clean vcpkg buildtrees (Windows)
        run: Remove-Item -Recurse -Force build\windows-x64\vcpkg_installed\*\buildtrees\* -ErrorAction SilentlyContinue

      - name: Build
        run: cmake --build build/windows-x64 --config Release
        
      - name: Test
        run: ctest --test-dir build/windows-x64 -C Release --output-on-failure
