name: Build & Test
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. WAJIB: Kosongkan disk (agar build OpenCV tidak gagal karena storage Ubuntu penuh)
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 2. PERBAIKAN: Tambahan build-essential, libxi-dev, libxtst-dev agar tidak error
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            gperf \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libtool-bin \
            libxi-dev \
            libxtst-dev \
            libxext-dev \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libwayland-dev

      # 3. OPTIMASI: Setup vcpkg dengan Binary Caching bawaan (lebih baik dari actions/cache)
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
          vcpkgJsonGlob: '**/vcpkg.json'

      # 4. Configure & Install Dependencies via vcpkg
      - name: Configure
        run: cmake --preset linux-x64 -DVCPKG_BUILD_TYPE=release
        
      # 5. OPTIMASI: Hapus sampah kompilasi untuk menghemat space sebelum build aplikasi utama Anda
      - name: Clean vcpkg buildtrees
        run: rm -rf build/linux-x64/vcpkg_installed/*/buildtrees/* || true

      - name: Build
        run: cmake --build build/linux-x64 --config Release -j$(nproc)
        
      - name: Test
        run: ctest --test-dir build/linux-x64 -C Release --output-on-failure


  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: Configure
        run: cmake --preset windows-x64 -DVCPKG_BUILD_TYPE=release
        
      - name: Clean vcpkg buildtrees (Windows)
        run: Remove-Item -Recurse -Force build\windows-x64\vcpkg_installed\*\buildtrees\* -ErrorAction SilentlyContinue

      - name: Build
        run: cmake --build build/windows-x64 --config Release
        
      - name: Test
        run: ctest --test-dir build/windows-x64 -C Release --output-on-failure
