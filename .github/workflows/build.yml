name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config gperf autoconf autoconf-archive automake libtool libtool-bin

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      - name: Configure
        run: cmake --preset linux-x64

      - name: Build
        run: cmake --build build/linux-x64 --config Release -j$(nproc)

      - name: Test
        run: ctest --test-dir build/linux-x64 --config Release --output-on-failure

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build build/windows-x64 --config Release

      - name: Test
        run: ctest --test-dir build/windows-x64 --config Release --output-on-failure
