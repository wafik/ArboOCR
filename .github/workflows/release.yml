name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/windows-x64/vcpkg_installed
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json') }}-cd61e1e
          restore-keys: |
            vcpkg-windows-x64-${{ hashFiles('vcpkg.json') }}-
            vcpkg-windows-x64-

      - name: Configure
        run: cmake --preset windows-x64 -DVCPKG_BUILD_TYPE=release

      - name: Build
        run: cmake --build build/windows-x64 --config Release

      - name: Test
        run: ctest --test-dir build/windows-x64 -C Release --output-on-failure

      - name: Package
        run: |
          $out = "package/arboocr-windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "build/windows-x64/Release/arboocr_demo.exe" $out
          Copy-Item "build/windows-x64/Release/*.dll" $out
          Copy-Item "LICENSE" $out
          Copy-Item "THIRD_PARTY_NOTICES.md" $out
          Compress-Archive -Path "$out/*" -DestinationPath "arboocr-windows-x64.zip"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: arboocr-windows-x64
          path: arboocr-windows-x64.zip

  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            gperf \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libtool-bin \
            patchelf \
            libxi-dev \
            libxtst-dev \
            libxext-dev \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libwayland-dev

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/linux-x64/vcpkg_installed
          key: vcpkg-linux-x64-${{ hashFiles('vcpkg.json') }}-cd61e1e
          restore-keys: |
            vcpkg-linux-x64-${{ hashFiles('vcpkg.json') }}-
            vcpkg-linux-x64-

      - name: Configure
        run: cmake --preset linux-x64 -DVCPKG_BUILD_TYPE=release

      - name: Clean vcpkg buildtrees
        run: rm -rf build/linux-x64/vcpkg_installed/*/buildtrees/* || true

      - name: Build
        run: cmake --build build/linux-x64 --config Release -j$(nproc)

      - name: Test
        run: ctest --test-dir build/linux-x64 -C Release --output-on-failure

      - name: Package
        run: |
          set -euo pipefail
          out="package/arboocr-linux-x64"
          mkdir -p "$out"
          bin="build/linux-x64/arboocr_demo"
          cp "$bin" "$out/"
          # Bundle every shared lib the binary resolves outside system dirs
          # (vcpkg-built onnxruntime/opencv/curl and their deps), and point
          # the binary at them via a relative RPATH so it's self-contained.
          # grep exits 1 on zero matches (e.g. everything is statically
          # linked except system libs) — with pipefail that would abort the
          # whole step even though "nothing extra to bundle" isn't an error.
          ldd "$bin" | awk '{print $3}' | grep -E '^/' | grep -v -E '^/lib|^/usr/lib' | while read -r lib; do
            cp -L "$lib" "$out/"
          done || true
          cp LICENSE THIRD_PARTY_NOTICES.md "$out/"
          patchelf --set-rpath '$ORIGIN' "$out/arboocr_demo" || true
          tar czf arboocr-linux-x64.tar.gz -C package arboocr-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: arboocr-linux-x64
          path: arboocr-linux-x64.tar.gz

  publish:
    needs: [windows-x64, linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/arboocr-windows-x64.zip
            dist/arboocr-linux-x64.tar.gz
